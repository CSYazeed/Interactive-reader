<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive PDF Reader</title>

    <!-- PDF.js -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        type="module">
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- =================================
             TOP BAR
        ================================== -->

        <header class="topbar">

            <div class="brand">

                <div class="brand-icon">
                    📖
                </div>

                <div>
                    <h1>Interactive Reader</h1>

                    <p>
                        Click an English word to hear it
                    </p>
                </div>

            </div>


            <label class="upload-button">

                <span>📂</span>

                Open PDF

                <input
                    type="file"
                    id="pdfInput"
                    accept="application/pdf"
                    hidden
                >

            </label>

        </header>


        <!-- =================================
             VOICE CONTROL PANEL
        ================================== -->

        <section class="voice-panel">

            <div class="voice-panel-inner">


                <!-- Voice selector -->

                <div class="voice-control">

                    <label for="voiceSelect">
                        🎙️ Voice
                    </label>

                    <select id="voiceSelect">

                        <option>
                            Loading voices...
                        </option>

                    </select>

                </div>


                <!-- Speed -->

                <div class="speed-control">

                    <label for="speedRange">
                        Speed
                    </label>

                    <div class="speed-row">

                        <span class="speed-icon">
                            🐢
                        </span>

                        <input
                            type="range"
                            id="speedRange"
                            min="0.5"
                            max="1.5"
                            step="0.05"
                            value="0.85"
                        >

                        <span class="speed-icon">
                            🐇
                        </span>

                        <span
                            id="speedValue"
                            class="speed-value"
                        >
                            0.85×
                        </span>

                    </div>

                </div>


                <!-- Test voice -->

                <button
                    id="testVoiceButton"
                    class="test-voice-button"
                >
                    🔊 Test Voice
                </button>

            </div>

        </section>


        <!-- =================================
             TOOLBAR
        ================================== -->

        <div class="toolbar">

            <div class="toolbar-group">

                <button
                    id="previousPage"
                    class="tool-button"
                    title="Previous page"
                >
                    ←
                </button>

                <div class="page-info">

                    <span id="currentPage">
                        1
                    </span>

                    <span class="page-separator">
                        /
                    </span>

                    <span id="totalPages">
                        0
                    </span>

                </div>

                <button
                    id="nextPage"
                    class="tool-button"
                    title="Next page"
                >
                    →
                </button>

            </div>


            <div class="toolbar-group">

                <button
                    id="zoomOut"
                    class="tool-button"
                    title="Zoom out"
                >
                    −
                </button>

                <span
                    id="zoomLevel"
                    class="zoom-level"
                >
                    100%
                </span>

                <button
                    id="zoomIn"
                    class="tool-button"
                    title="Zoom in"
                >
                    +
                </button>

            </div>

        </div>


        <!-- =================================
             PDF VIEWER
        ================================== -->

        <main class="viewer-container">

            <div
                id="welcomeScreen"
                class="welcome-screen"
            >

                <div class="welcome-icon">
                    📄
                </div>

                <h2>
                    Open a PDF to begin
                </h2>

                <p>
                    Upload an English PDF and click any
                    English text to hear its pronunciation.
                </p>

                <label class="large-upload-button">

                    Choose PDF

                    <input
                        type="file"
                        id="pdfInputLarge"
                        accept="application/pdf"
                        hidden
                    >

                </label>

            </div>


            <div
                id="pdfViewer"
                class="pdf-viewer"
            ></div>

        </main>


        <!-- =================================
             STATUS BAR
        ================================== -->

        <footer class="statusbar">

            <div
                id="statusMessage"
                class="status-message"
            >
                No PDF loaded
            </div>

            <div
                id="pronunciationStatus"
                class="pronunciation-status"
            >
                🔊 Click English text
            </div>

        </footer>

    </div>


    <!-- JavaScript -->

    <script
        type="module"
        src="script.js">
    </script>

</body>

</html>
